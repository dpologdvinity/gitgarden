version: 2
project_name: gitgarden
builds:
  - main: .
    binary: gitgarden
    env: [CGO_ENABLED=0]
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ldflags: ["-s -w -X main.version={{.Version}}"]
archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
checksum:
  name_template: checksums.txt
homebrew_casks:
  - repository:
      owner: dpologdvinity
      name: homebrew-tap
      branch: master
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    directory: Casks
    homepage: "https://github.com/dpologdvinity/gitgarden"
    description: "Grow an animated ASCII garden from your git history"
    license: "MIT"
